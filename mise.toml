[tools]
go = "1.26.9"
golangci-lint = "2.12.2"
goreleaser = "2.16.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.3.0"
"go:golang.org/x/tools/gopls" = "0.22.0"
pinact = "4.0.0"

[tasks.test]
description = "Run tests"
run = "go test -race ./... -v"

[tasks.lint]
description = "Lint the source code"
run = "golangci-lint run"

[tasks.vulncheck]
description = "Vulnerability checking"
run = "govulncheck ./..."

[tasks.release]
description = "Release a new version"
# Release notes are the tagged version's CHANGELOG.md section, kept outside
# the repo so goreleaser still sees a clean tree.
run = '''
set -eu
tag=$(git describe --tags --exact-match)
notes=$(mktemp)
awk -v h="## [${tag#v}]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md > "$notes"
grep -q . "$notes" || { echo "no CHANGELOG.md section for $tag" >&2; exit 1; }
goreleaser release --clean --release-notes "$notes"
'''

[tasks.pinact]
description = "Update and pin GitHub Actions"
run = "pinact run -u"
